#pipeline to install the application and create the infra at the azure cloud

name: Netflix App installation
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
      
      - name: Install Dontnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      
      - name: Restore Dependencies
        run: dotnet restore

      - name: Publish 
        run: dotnet publish --configuration Release --output ./publish

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: drop
          path: ./publish
