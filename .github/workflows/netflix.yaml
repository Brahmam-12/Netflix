name: Pipeline
on:
  push:
    branches:
      - main

jobs:
  Build:
    name: Build Job
    runs-on: ubuntu-latest
    steps:
      - name: Install Dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x
      
      - name: checkout code
        uses: actions/checkout@v4

      - name: Build
        run: dotnet publish . --configuration Release --output ./publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: drop
          path: ./publish

  DockerImage:
    runs-on: ubuntu-latest
    needs: Build
    steps:
      # - name: Install DockerImage #commented because it comes default with runner
      #   uses: actions/docker@v2
      #   with:
      #     docker-version: latest

      - name: checkout code
        uses: actions/checkout@v4

      - name: login azure cli
        uses: azure/login@v2
        with:
          creds: ${{secrets.AZURE_CREDENTIALS}}
      
      - name: login acr
        run: az acr login --name netflixapp
       
      - name: Create DockerImage
        run: docker build . -t netflixapp.azurecr.io/netflix:${{github.run_number}}

      - name: push to acr
        run: docker push netflixapp.azurecr.io/netflix:${{github.run_number}}

  DevInfra:
    runs-on: ubuntu-latest
    needs: DockerImage
    steps:
      - name: install terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: latest

      - name: checkout code
        uses: actions/checkout@v4
      
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{secrets.AZURE_CREDENTIALS}}
      
      - name: terraform apply
        run: |
          pwd
          ls
          cd ${{github.workspace}}/Terraform
          terraform init --reconfigure --backend-config="backend-dev.conf"
          terraform apply -var-file="dev.tfvars" --auto-approve

  DevDeploy:
    runs-on: ubuntu-latest
    needs: DevInfra
    steps:
      - name: download artifact
        uses: actions/download-artifact@v1
        with:
          name: drop
          path: ./publish
      
      - name: azure cli
        uses: azure/login@v2
        with:
          creds: ${{secrets.AZURE_CREDENTIALS}}

      - name: deploy Artifact
        uses: azure/webapp-deploy@v4
        with:
          app-name: netflix-dev-web-app
          package: ./publish

  K8sInfra:
    needs: DevDeploy
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4
      
      - name: Terraform Install
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: latest
      
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{secrets.AZURE_CREDENTIALS}}
      
      - name: Infra
        run: |
          cd ${{github.workspace}}/k8s/terraform
          terraform init
          terraform apply --auto-approve
      
